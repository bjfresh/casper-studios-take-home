name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mirrors .env.example: same user, same host port (5433), same test database name.
# If you change a value in .env.example, change it here too.
env:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
  POSTGRES_PORT: 5433
  DATABASE_URL: postgres://app:app@localhost:5433/app_test
  TEST_DATABASE_URL: postgres://app:app@localhost:5433/app_test
  NEXT_PUBLIC_API_URL: http://localhost:3001

jobs:
  # Its own job so a lint failure is visible at a glance on the PR.
  # No database: none of lint/typecheck touch one. Add the postgres service if that changes.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          # CI only needs the test database, so it's the service's primary DB.
          POSTGRES_DB: app_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for Vitest browser-mode component tests.
      - run: pnpm e2e:install
      - run: pnpm db:migrate
      - run: pnpm db:curriculum
      - run: pnpm test
      - run: pnpm build
